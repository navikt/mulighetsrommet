apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: mulighetsrommet-arena-adapter-manager
  namespace: team-mulighetsrommet
  labels:
    team: team-mulighetsrommet
spec:
  image: europe-north1-docker.pkg.dev/nais-management-233d/poao/poao-frontend:2026.08.07_09.17-7dc500768b63
  port: 8080
  ingresses:
    - https://mulighetsrommet-arena-adapter-manager.intern.dev.nav.no
  replicas:
    min: 1
    max: 1
  resources:
    requests:
      cpu: 1m
      memory: 256Mi
    limits:
      memory: 512Mi
  liveness:
    path: /internal/alive
    initialDelay: 10
  readiness:
    path: /internal/ready
    initialDelay: 10
  azure:
    application:
      enabled: true
      claims:
        groups:
          # team-mulighetsrommet
          - id: "639e2806-4cc2-484c-a72a-51b4308c52a1"
    sidecar:
      enabled: true
      autoLogin: true
  accessPolicy:
    outbound:
      rules:
        - application: mulighetsrommet-arena-adapter
        - application: mulighetsrommet-api
        - application: tiltakshistorikk
        - application: tiltaksokonomi
  env:
    - name: JSON_CONFIG
      value: >
        {
          "gcs": {
            "bucketName": "nais-cdn-nav-team-mulighetsrommet-4a92",
            "bucketContextPath": "team-mulighetsrommet/dev/arena-adapter-manager/dist/"
          },
          "auth": {
            "loginProvider": "AZURE_AD"
          },
          "proxies": [
            {
              "fromPath": "/mulighetsrommet-arena-adapter",
              "toUrl": "http://mulighetsrommet-arena-adapter",
              "preserveFromPath": false,
              "toApp": {
                "name": "mulighetsrommet-arena-adapter",
                "namespace": "team-mulighetsrommet",
                "cluster": "dev-gcp"
              }
            },
            {
              "fromPath": "/mulighetsrommet-api",
              "toUrl": "http://mulighetsrommet-api",
              "preserveFromPath": false,
              "toApp": {
                "name": "mulighetsrommet-api",
                "namespace": "team-mulighetsrommet",
                "cluster": "dev-gcp"
              }
            },
            {
              "fromPath": "/tiltakshistorikk",
              "toUrl": "http://tiltakshistorikk",
              "preserveFromPath": false,
              "toApp": {
                "name": "tiltakshistorikk",
                "namespace": "team-mulighetsrommet",
                "cluster": "dev-gcp"
              }
            },
            {
              "fromPath": "/tiltaksokonomi",
              "toUrl": "http://tiltaksokonomi",
              "preserveFromPath": false,
              "toApp": {
                "name": "tiltaksokonomi",
                "namespace": "team-mulighetsrommet",
                "cluster": "dev-gcp"
              }
            }
          ]
        }
