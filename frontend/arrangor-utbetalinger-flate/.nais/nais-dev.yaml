apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: arrangor-utbetalinger-flate
  namespace: team-mulighetsrommet
  labels:
    team: team-mulighetsrommet
  annotations:
    haproxy.org/backend-config-snippet: |
      option http-buffer-request
      acl body_too_large req.body_size gt 52428800
      http-request deny deny_status 413 if body_too_large
    haproxy.com/timeout-server: "300s"
spec:
  image: "{{ image }}"
  port: 3000
  ingresses:
    - https://arrangor-utbetaling.intern.dev.nav.no
    - https://arrangor-utbetaling.ansatt.dev.nav.no
  replicas:
    min: 1
    max: 2
    scalingStrategy:
      cpu:
        thresholdPercentage: 75
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
    limits:
      memory: 1024Mi
  liveness:
    path: /internal/isAlive
    initialDelay: 20
  readiness:
    path: /internal/isReady
    initialDelay: 20
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
    logging:
      destinations:
        - id: elastic
        - id: loki
  prometheus:
    enabled: true
    path: /metrics
  frontend:
    generatedConfig:
      mountPath: /app/build/client/nais.js
  accessPolicy:
    outbound:
      rules:
        - application: nav-dekoratoren
          namespace: personbruker
        - application: mulighetsrommet-api
  tokenx:
    enabled: true
  idporten:
    enabled: true
    sidecar:
      enabled: true
      level: Level3
      autoLogin: true
      autoLoginIgnorePaths:
        - /internal/*
        - /metrics
